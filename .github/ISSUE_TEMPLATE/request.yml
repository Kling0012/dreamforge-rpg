name: 要望 / Request
description: 追加や変更の要望を送る / Suggest an addition or change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        このMODは、すべてAIが作成しています。テストプレイは行っていません。小さなことでも、報告を歓迎します。
        This mod is made entirely by AI and has not been play-tested. Every report is welcome, however small.
  - type: textarea
    id: request
    attributes:
      label: 要望 / Request
      description: 何をどう変えてほしいか、その理由 / What you would like changed, and why
    validations:
      required: true
